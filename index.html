<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SAFE SCHOOL - Recognize Section 2</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;

      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: transparent;
    }

    img {
      display: block;
      max-width: 100%;
    }


    /* =====================================================
       SECTION 2
       GỌN HƠN - CÂN VỚI SECTION 3
    ===================================================== */

    .forms-section {
      position: relative;

      width: 100%;

      padding:
        44px 0 48px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #f8fcfd 0%,
          #eef8fa 100%
        );
    }


    /* =====================================================
       DECORATION
    ===================================================== */

    .forms-section::before {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      left: -85px;
      top: -75px;

      border-radius: 50%;

      background:
        rgba(15, 163, 163, .045);

      pointer-events: none;
    }


    .forms-section::after {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      right: -85px;
      bottom: -80px;

      border-radius: 50%;

      background:
        rgba(15, 163, 163, .045);

      pointer-events: none;
    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .forms-container {
      position: relative;

      z-index: 2;

      width:
        min(1260px, 92%);

      margin:
        0 auto;
    }


    /* =====================================================
       HEADING
    ===================================================== */

    .forms-heading {
      max-width: 760px;

      margin:
        0 auto 26px;

      text-align: center;
    }


    .forms-eyebrow {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-bottom: 7px;

      color: #078f90;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: .10em;

      text-transform: uppercase;
    }


    .forms-eyebrow::before,
    .forms-eyebrow::after {
      content: "";

      width: 34px;
      height: 2px;

      border-radius: 999px;

      background: #0fa3a3;
    }


    .forms-heading h2 {
      margin:
        0 0 8px;

      color: #071a4c;

      font-size:
        clamp(27px, 3vw, 38px);

      font-weight: 800;

      line-height: 1.15;
    }


    .forms-heading p {
      max-width: 680px;

      margin:
        0 auto;

      color: #61788f;

      font-size: 13px;

      line-height: 1.55;
    }


    /* =====================================================
       FIVE CARDS
    ===================================================== */

    .forms-grid {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 14px;

      align-items: center;

      justify-items: center;
    }


    /* =====================================================
       CARD
    ===================================================== */

    .form-card {
      width: 100%;

      max-width: 218px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-decoration: none;

      transition:
        transform .22s ease,
        filter .22s ease;
    }


    .form-card:hover {
      transform:
        translateY(-4px);

      filter:
        drop-shadow(
          0 9px 14px
          rgba(18, 53, 91, .10)
        );
    }


    /* QUAN TRỌNG:
       giới hạn kích thước ảnh card */

    .form-card img {
      width: 100%;

      max-width: 218px;

      height: auto;

      display: block;

      object-fit: contain;
    }


    /* =====================================================
       NOTE
    ===================================================== */

    .forms-note {
      margin-top: 20px;

      text-align: center;

      color: #078f90;

      font-size: 12px;

      font-weight: 700;

      line-height: 1.5;
    }


    /* =====================================================
       LAPTOP
       3 + 2 CENTER
    ===================================================== */

    @media (max-width: 1050px) {

      .forms-container {
        width: min(900px, 92%);
      }


      .forms-grid {
        grid-template-columns:
          repeat(6, 1fr);

        gap: 16px;
      }


      .form-card {
        grid-column:
          span 2;

        max-width: 220px;
      }


      .form-card:nth-child(4) {
        grid-column:
          2 / span 2;
      }


      .form-card:nth-child(5) {
        grid-column:
          4 / span 2;
      }


      .form-card img {
        max-width: 220px;
      }

    }


    /* =====================================================
       TABLET
       2 + 2 + 1
    ===================================================== */

    @media (max-width: 720px) {

      .forms-section {
        padding:
          40px 0 44px;
      }


      .forms-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 15px;
      }


      .form-card,
      .form-card:nth-child(4),
      .form-card:nth-child(5) {
        grid-column: auto;

        width: 100%;

        max-width: 235px;
      }


      .form-card:nth-child(5) {
        grid-column:
          1 / -1;

        justify-self: center;
      }


      .form-card img {
        max-width: 235px;
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      .forms-section {
        padding:
          36px 0 40px;
      }


      .forms-container {
        width: 90%;
      }


      .forms-heading {
        margin-bottom: 22px;
      }


      .forms-eyebrow {
        font-size: 10px;
      }


      .forms-eyebrow::before,
      .forms-eyebrow::after {
        width: 24px;
      }


      .forms-heading h2 {
        font-size: 27px;
      }


      .forms-heading p {
        font-size: 13px;
      }


      .forms-grid {
        grid-template-columns:
          1fr;

        gap: 13px;
      }


      .form-card,
      .form-card:nth-child(4),
      .form-card:nth-child(5) {
        grid-column: auto;

        width: 100%;

        max-width: 280px;

        justify-self: center;
      }


      .form-card img {
        max-width: 280px;
      }


      .forms-note {
        margin-top: 17px;

        font-size: 12px;
      }

    }

  </style>

</head>


<body>


  <section class="forms-section">

    <div class="forms-container">


      <!-- HEADING -->

      <div class="forms-heading">

        <div class="forms-eyebrow">
          What counts as school violence?
        </div>


        <h2>
          School violence can take many forms.
        </h2>


        <p>
          It can happen in person or online,
          intentionally or unintentionally.
          Understanding the different forms can help us
          recognize, prevent, and respond to it.
        </p>

      </div>



      <!-- FIVE CARDS -->

      <div class="forms-grid">


        <!-- PHYSICAL -->

        <a
          href="#"
          class="form-card"
        >

          <img
            src="1.png"
            alt="Physical Violence"
          >

        </a>



        <!-- PSYCHOLOGICAL -->

        <a
          href="#"
          class="form-card"
        >

          <img
            src="2.png"
            alt="Psychological Violence"
          >

        </a>



        <!-- SEXUAL -->

        <a
          href="#"
          class="form-card"
        >

          <img
            src="3.png"
            alt="Sexual Violence"
          >

        </a>



        <!-- BULLYING -->

        <a
          href="#"
          class="form-card"
        >

          <img
            src="4.png"
            alt="Bullying"
          >

        </a>



        <!-- CYBERBULLYING -->

        <a
          href="#"
          class="form-card"
        >

          <img
            src="5.png"
            alt="Cyberbullying"
          >

        </a>


      </div>



      <!-- NOTE -->

      <div class="forms-note">

        Different forms. The same impact.
        Recognizing them is the first step.

      </div>


    </div>

  </section>


</body>

</html>
